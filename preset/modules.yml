# 政务工作台模块 —— tizhi-agent-ui 侧栏工作台从这里读模块。
# 改这个文件即可增删模块（保存后刷新浏览器生效），无需重新构建插件。
# 字段与情境卡一致：key / title / hint / template（点击后预填进输入框）。

- key: meeting
  title: 会议安排
  hint: 通知 · 议程 · 纪要
  template: 帮我安排一个会议：主题「……」，参会范围……，时间……。先出会议通知和议程，开完我再找你整理纪要。

- key: weekly
  title: 每周总结
  hint: 亮点 · 数据 · 下周
  template: 帮我写本周工作总结：本周主要做了……。按亮点、数据、问题、下周打算来组织。

- key: study
  title: 思想学习
  hint: 心得 · 体会 · 结合实际
  template: 帮我整理一篇学习心得：学习主题是「……」，要求结合本职工作谈体会，不空喊口号。

- key: report
  title: 汇报材料
  hint: 提纲 · 口径 · 数据
  template: 要向领导汇报「……」，帮我先拉一个汇报提纲，把口径和重点捋清楚。

- key: gongwen
  title: 公文起草
  hint: 通知 · 请示 · 报告
  template: 帮我起草一份公文：文种是……，事由是……。先出大纲我确认再展开。
